name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The pinned SDK builds; the net10.0 runtime is what the test assembly runs on.
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup the pinned SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build ModeMath.slnx --configuration Release

      - name: Test
        run: dotnet run --project ModeMath.Tests/ModeMath.Tests.fsproj -c Release

  aot:
    name: AOT
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install the native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # Warnings are errors, so this fails on anything in the library that AOT cannot support.
      - name: Publish
        run: dotnet publish tools/AotCheck/AotCheck.fsproj -c Release -r linux-x64
