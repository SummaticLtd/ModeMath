name: Release to NuGet

on:
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: ubuntu-latest
    # Trusted publishing trusts this file, not the branch it runs from, and a dispatch may name any.
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The pinned SDK builds; the net10.0 runtime is what the test assembly runs on.
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup the pinned SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ModeMath/ModeMath.fsproj

      - name: Build
        run: dotnet build ModeMath/ModeMath.fsproj -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet run --project ModeMath.Tests/ModeMath.Tests.fsproj -c Release

      - name: Pack
        run: dotnet pack ModeMath/ModeMath.fsproj -c Release --no-build -o ./nupkgs -p:ContinuousIntegrationBuild=true

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: charles.roddie

      # Pushing the package alone carries its symbols along, so a release that published one but
      # not the other could never be repeated: the second run skips both as duplicates.
      - name: Push the package
        run: dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols

      - name: Push the symbols
        run: dotnet nuget push ./nupkgs/*.snupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
