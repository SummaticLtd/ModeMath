name: Release to NuGet

on:
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: ubuntu-latest
    # A dispatch may name any branch, where trusted publishing trusts the workflow rather than the ref.
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ModeMath/ModeMath.fsproj

      - name: Build
        run: dotnet build ModeMath/ModeMath.fsproj -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet run --project ModeMath.Tests/ModeMath.Tests.fsproj -c Release

      - name: Pack
        run: dotnet pack ModeMath/ModeMath.fsproj -c Release --no-build -o ./nupkgs -p:ContinuousIntegrationBuild=true

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: charles.roddie

      # Each artifact is pushed by name, so a run that got one of them up can be dispatched again
      # for the other. Pushing the package alone would take its symbols with it, and skip both.
      - name: Push the package
        run: dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols

      - name: Push the symbols
        run: dotnet nuget push ./nupkgs/*.snupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
